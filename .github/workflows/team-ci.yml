# 팀 포크 전용 CI. 원본의 toybox.yml 은 master push 때만 돌기 때문에
# dev 로 가는 PR 과 dev / feature 브랜치 push 에서 빌드·테스트를 실행한다.
name: team CI

on:
  pull_request:
    branches: [ dev ]
  push:
    branches: [ dev, 'feature/**' ]

env:
  # 팀에서 작업하는 명령. 새 작업을 시작하면 여기에 추가한다.
  # tests/NAME.test 가 아직 없는 명령은 건너뛴다.
  TEAM_TESTS: fdstat column lsof netstat vmstat pwdx free pmap sysctl envsubst ipcs w ulimit
  # root 권한이 필요한 테스트 (sudo 로 실행)
  ROOT_TESTS: swapon

jobs:
  build-test:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v5

    - name: Setup
      run: sudo apt-get update && sudo apt-get install -y build-essential

    - name: Build defconfig
      run: make defconfig && make -j$(nproc)

    - name: Team command tests
      run: |
        fail=0
        for t in $TEAM_TESTS; do
          [ -f tests/$t.test ] || { echo "skip: $t (no test)"; continue; }
          echo "::group::test_$t"
          VERBOSE=fail make test_$t || fail=1
          echo "::endgroup::"
        done
        exit $fail

    - name: Root tests
      run: |
        fail=0
        for t in $ROOT_TESTS; do
          [ -f tests/$t.test ] || { echo "skip: $t (no test)"; continue; }
          echo "::group::test_$t (root)"
          sudo env PATH="$PATH" VERBOSE=fail make test_$t || fail=1
          echo "::endgroup::"
        done
        exit $fail
